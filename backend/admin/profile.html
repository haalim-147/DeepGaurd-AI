<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Profile | DeepGuard</title>

    <link rel="stylesheet" href="profile.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <h2>DeepGuard</h2>
            <p>Admin Panel</p>
        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>

            <a href="users.html" class="nav-item">
                <i class="fa-solid fa-users"></i>
                <span>Users</span>
            </a>

            <a href="analyses.html" class="nav-item">
                <i class="fa-solid fa-file-circle-check"></i>
                <span>Analyses</span>
            </a>

            <a href="feedback.html" class="nav-item">
                <i class="fa-solid fa-comments"></i>
                <span>Feedback</span>
            </a>

            <a href="audit-logs.html" class="nav-item">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Audit Logs</span>
            </a>

            <a href="profile.html" class="nav-item active">
                <i class="fa-solid fa-user-gear"></i>
                <span>Profile</span>
            </a>

        </nav>

        <div class="sidebar-bottom">
            <a href="index.html" class="nav-item logout">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </div>

    </aside>


    <!-- Main Content -->

    <main class="main-content">

        <!-- TOPBAR -->
<header class="topbar">

    <div class="top-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" placeholder="Search...">
    </div>

    <div class="admin-info">

        <button class="notification" type="button" aria-label="Notifications">
            <svg xmlns="http://www.w3.org/2000/svg"
                width="22" height="22" viewBox="0 0 24 24"
                fill="none" stroke="#374151" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                <path d="M10 21h4"></path>
            </svg>
        </button>

        <div class="admin-avatar">A</div>

        <div class="admin-details">
            <strong>Admin</strong>
            <small>Administrator</small>
        </div>

    </div>
</header>


        <!-- Profile Section -->

        <section class="profile-section">

            <h1>Profile</h1>

            <div class="profile-card">

                <div class="profile-image">
                    A
                </div>

                <h2>Admin</h2>

                <div class="profile-options">

                    <button type="button" onclick="editProfile()">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span>Edit Profile</span>
                    </button>

                    <button type="button" onclick="changePassword()">
                        <i class="fa-solid fa-lock"></i>
                        <span>Change Password</span>
                    </button>

                </div>

            </div>

        </section>


        <!-- Footer -->

        <footer class="page-footer">
            © 2026 DeepGuard. All rights reserved.
        </footer>

    </main>


    <script src="profile.js"></script>

</body>
</html>
